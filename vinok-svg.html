<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>vinok format</title>
</head>
<body>
  <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 0;">
    
    <?xml version="1.0" encoding="UTF-8"?>
    <svg
        xmlns="http://www.w3.org/2000/svg"
        width="900"
        height="420"
        viewBox="0 0 1200 420"
        fill="none"
        style="display: block; transform: translateX(30px);"
    >

      <!-- =========================================
           VINOK — English Version
           ========================================= -->

      <!-- Deep Twilight : #07004D -->
      <!-- Baltic Blue   : #006494 -->
      <!-- Frozen Lake   : #6CD4FF -->

      <!-- =========================
           WORDMARK
           ========================= -->

      <!-- V -->
      <path
          d="M55 65 L125 275 L195 65"
          stroke="#07004D"
          stroke-width="48"
          stroke-linecap="round"
          stroke-linejoin="round"
      />

      <!-- I -->
      <path
          d="M265 65 V275"
          stroke="#07004D"
          stroke-width="48"
          stroke-linecap="round"
      />

      <!-- N -->
      <path
          d="M350 275 V65 L510 275 V65"
          stroke="#07004D"
          stroke-width="48"
          stroke-linecap="round"
          stroke-linejoin="round"
      />

      <!-- =========================
           O — DATA FORMAT SYMBOL
           ========================= -->

      <!-- Left bracket -->
      <path
          d="M625 75
             H595
             Q575 75 575 95
             V245
             Q575 265 595 265
             H625"
          stroke="#6CD4FF"
          stroke-width="28"
          stroke-linecap="round"
          stroke-linejoin="round"
      />

      <!-- Right bracket -->
      <path
          d="M735 75
             H765
             Q785 75 785 95
             V245
             Q785 265 765 265
             H735"
          stroke="#6CD4FF"
          stroke-width="28"
          stroke-linecap="round"
          stroke-linejoin="round"
      />

      <!-- =========================
           K
           ========================= -->

      <!-- Vertical -->
      <path
          d="M865 65 V275"
          stroke="#07004D"
          stroke-width="48"
          stroke-linecap="round"
      />

      <!-- Upper diagonal -->
      <path
          d="M865 180 L1035 65"
          stroke="#07004D"
          stroke-width="48"
          stroke-linecap="round"
          stroke-linejoin="round"
      />

      <!-- Lower diagonal -->
      <path
          d="M925 145 L1040 275"
          stroke="#07004D"
          stroke-width="48"
          stroke-linecap="round"
          stroke-linejoin="round"
      />

      <!-- =========================
           ENGLISH TAGLINE
           ========================= -->

      <!-- A FORMAT. -->
      <text
          x="285"
          y="350"
          fill="#07004D"
          font-family="Arial, Helvetica, sans-serif"
          font-size="27"
          font-weight="600"
          letter-spacing="4"
      >
          A FORMAT.
      </text>

      <!-- SIMPLY. -->
      <text
          x="575"
          y="350"
          fill="#6CD4FF"
          font-family="Arial, Helvetica, sans-serif"
          font-size="27"
          font-weight="600"
          letter-spacing="4"
      >
          SIMPLY.
      </text>

    </svg>

  </div>
</body>
</html>
